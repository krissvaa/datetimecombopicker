name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-component:
    name: Web component (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-component
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-component/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test

  flow:
    name: Flow add-on (Vaadin ${{ matrix.vaadin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported V25 platform and current latest
        vaadin: ['25.1.11', '25.2.6']
    defaults:
      run:
        working-directory: flow
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -ntp verify -Dvaadin.version=${{ matrix.vaadin }}

  directory-package:
    name: Vaadin Directory package (assembly, sources, javadoc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -ntp install -Pdirectory -DskipTests
      - name: Verify zip contents
        run: |
          unzip -l target/datetimecombopicker-*.zip
          unzip -p target/datetimecombopicker-*.zip META-INF/MANIFEST.MF | grep -q "Vaadin-Addon:"

  integration-tests:
    name: Integration tests (Vaadin ${{ matrix.vaadin }}, Chromium)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vaadin: ['25.1.11', '25.2.6']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: it/package-lock.json
      - name: Install test dependencies
        working-directory: it
        run: npm ci
      - name: Install Chromium
        working-directory: it
        run: npx playwright install --with-deps chromium
      - name: Run integration tests (starts the demo server)
        working-directory: it
        run: npx playwright test
        env:
          VAADIN_VERSION: ${{ matrix.vaadin }}
          VAADIN_PRODUCTION: 'true'
          # Server license key (vaadin.com/myaccount/licenses): Vaadin 24.10+
          # extended-maintenance releases validate the license even for
          # production builds of core-only apps
          VAADIN_OFFLINE_KEY: ${{ secrets.VAADINOFFLINEKEY }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces-${{ matrix.vaadin }}
          path: it/test-results/
          retention-days: 7
