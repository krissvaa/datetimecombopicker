<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F87FF"/>
      <stop offset="1" stop-color="#0D5BC4"/>
    </linearGradient>
  </defs>

  <!-- app-tile background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- calendar card -->
  <g>
    <rect x="88" y="112" width="272" height="288" rx="28" fill="#FFFFFF"/>
    <!-- header -->
    <path d="M88 140 a28 28 0 0 1 28 -28 h216 a28 28 0 0 1 28 28 v56 H88 Z" fill="#0A409C"/>
    <!-- binder rings -->
    <rect x="140" y="84" width="24" height="64" rx="12" fill="#FFFFFF"/>
    <rect x="140" y="84" width="24" height="64" rx="12" fill="none" stroke="#0A409C" stroke-width="12"/>
    <rect x="284" y="84" width="24" height="64" rx="12" fill="#FFFFFF"/>
    <rect x="284" y="84" width="24" height="64" rx="12" fill="none" stroke="#0A409C" stroke-width="12"/>

    <!-- day grid: 4 cols x 3 rows, one highlighted -->
    <g fill="#B9D4F8">
      <rect x="120" y="228" width="40" height="36" rx="9"/>
      <rect x="176" y="228" width="40" height="36" rx="9"/>
      <rect x="232" y="228" width="40" height="36" rx="9"/>
      <rect x="288" y="228" width="40" height="36" rx="9"/>
      <rect x="120" y="280" width="40" height="36" rx="9"/>
      <rect x="232" y="280" width="40" height="36" rx="9"/>
      <rect x="288" y="280" width="40" height="36" rx="9"/>
      <rect x="120" y="332" width="40" height="36" rx="9"/>
      <rect x="176" y="332" width="40" height="36" rx="9"/>
    </g>
    <!-- selected day -->
    <rect x="176" y="280" width="40" height="36" rx="9" fill="#1676F3"/>
  </g>

  <!-- clock badge -->
  <g>
    <circle cx="368" cy="352" r="104" fill="#0A409C"/>
    <circle cx="368" cy="352" r="88" fill="#FFFFFF"/>
    <!-- ticks -->
    <g stroke="#B9D4F8" stroke-width="10" stroke-linecap="round">
      <line x1="368" y1="284" x2="368" y2="298"/>
      <line x1="368" y1="406" x2="368" y2="420"/>
      <line x1="300" y1="352" x2="314" y2="352"/>
      <line x1="422" y1="352" x2="436" y2="352"/>
    </g>
    <!-- hands: 10:10-ish -->
    <g stroke="#0A409C" stroke-linecap="round">
      <line x1="368" y1="352" x2="368" y2="302" stroke-width="16"/>
      <line x1="368" y1="352" x2="408" y2="376" stroke-width="16"/>
    </g>
    <circle cx="368" cy="352" r="11" fill="#1676F3"/>
  </g>
</svg>
